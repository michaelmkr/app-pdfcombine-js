# Coolify / Nixpacks: build static SPA, serve dist/ only.
# Prefer Coolify "static site" with Publish Directory = dist (Caddy).
# PDFs are never processed on the server.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

# Used only for non-static / Node deployments.
[start]
cmd = "npm start"
